[workspace]
members = ["crates/cleaner-core"]
resolver = "3"

[package]
name = "cc-cleaner-at-home"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "cleaner"
doctest = false

[[bin]]
name = "cc-cleaner"
path = "src/main.rs"
test = false

[dependencies]
cleaner-core = { path = "crates/cleaner-core" }

[target.'cfg(windows)'.dependencies]
# GPUI is pre-1.0. Keep every zed crate on the same revision, and rerun the checks
# in README.md whenever the revision changes. The pinned revision is from 2026-09-25.
gpui = { git = "https://github.com/zed-industries/zed", rev = "933d8d93819c749a607e561883855a9b95c79cea", default-features = false }
gpui_windows = { git = "https://github.com/zed-industries/zed", rev = "933d8d93819c749a607e561883855a9b95c79cea", default-features = false }
futures = "0.3"
raw-window-handle = "0.6"
# Same major version as gpui_windows, so both share one build.
windows = { version = "0.62", features = [
    "Foundation",
    "Wdk_Foundation",
    "Wdk_Storage_FileSystem",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "UI_ViewManagement",
    "Win32_Graphics_Gdi",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# CI runs Clippy with `-D warnings`, so these fail the build there.
[lints]
workspace = true

[workspace.lints.clippy]
# Byte counts must stay exact, so flag `as` casts that can truncate or change sign.
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[build-dependencies]
embed-resource = "3.0"

[target.'cfg(windows)'.dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", rev = "933d8d93819c749a607e561883855a9b95c79cea", default-features = false, features = ["test-support"] }
tempfile = "3"
filetime = "0.2"

# Zed patches async-task at the workspace level; git dependents do not inherit it.
[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
