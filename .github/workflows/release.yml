name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - name: Check tag matches package version
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $package = ($metadata | ConvertFrom-Json).packages |
            Where-Object { $_.name -eq 'cc-cleaner-at-home' }
          if ($env:RELEASE_TAG -cne "v$($package.version)") {
            throw "Tag $env:RELEASE_TAG must match Cargo.toml version v$($package.version)."
          }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --release --locked --bin cc-cleaner
      - name: Create checksum
        run: |
          $hash = (Get-FileHash target/release/cc-cleaner.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  cc-cleaner.exe" | Set-Content target/release/cc-cleaner.exe.sha256 -Encoding ascii
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          @'
          Download **cc-cleaner.exe** for **Windows 11 x64**. No installer or additional runtime is required. The checksum is in **cc-cleaner.exe.sha256**.

          The app requires administrator rights and is unsigned. Windows may warn or block it.

          To update, close the app and replace the executable. Your saved Selection is preserved.
          '@ | Set-Content "$env:RUNNER_TEMP/release-notes.md" -Encoding utf8
          $releaseArgs = @(
            'release', 'create', $env:RELEASE_TAG,
            '--verify-tag', '--draft', '--generate-notes',
            '--title', $env:RELEASE_TAG,
            '--notes-file', "$env:RUNNER_TEMP/release-notes.md",
            'target/release/cc-cleaner.exe',
            'target/release/cc-cleaner.exe.sha256'
          )
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' }
          gh @releaseArgs
